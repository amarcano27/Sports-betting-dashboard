name: Daily Odds Refresh + AI Recommendations

on:
  schedule:
    # ── Afternoon pull: 1:00 PM ET (17:00 UTC) — bookmakers have posted lines ──
    - cron: "0 17 * * *"
    # ── Evening pull: 5:00 PM ET (21:00 UTC) — final pre-game lines ──────────
    - cron: "0 21 * * *"
  workflow_dispatch:    # allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
      ODDS_API_KEY:      ${{ secrets.ODDS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch live odds (all sports)
        run: python workers/fetch_all_odds.py --sport all

      - name: Fetch player data (NBA game logs)
        run: python workers/fetch_live_players.py --sport nba
        continue-on-error: true

      - name: Build math engine recommendations
        run: python workers/build_ai_recommendations.py

      - name: Write APEX analysis to Supabase
        run: python workers/apex_today.py

      - name: Done
        run: echo "Full pipeline complete at $(date)"
